# ─────────────────────────────────────────────────────────────────────────────
# models.yaml — Chat models for the LLM stack
#
# This file drives two downstream configs (auto-generated — do not edit them):
#   litellm/config.yaml      ← LiteLLM API gateway model list
#   ollama/init-models.sh    ← which models Ollama pulls on first start
#
# To add / remove a model:
#   1. Edit this file
#   2. Run:  ./deploy.sh render          (just re-render, no restart)
#      or:   ./manage.sh apply-models    (re-render + restart litellm)
#
# provider: ollama (default) — served by the shared Ollama instance on gpusrv02
#           openai           — any OpenAI-compatible server (e.g. vLLM) at a
#                               custom api_base (requires api_base + openai_model)
# num_retries: per-model override of the global litellm_settings.num_retries.
#              Set to 0 for models whose timeout is realistically reachable
#              under load — retrying a slow-but-working backend just adds more
#              concurrent load and makes it slower (retry storm). See
#              DevOps CLAUDE.md "GPU Inference Server" notes, 2026-07-29.
# ─────────────────────────────────────────────────────────────────────────────

# ── Chat / Completion models (served by Ollama) ──────────────────────────────
# NOTE: gemma4:31b (the primary chat model as of 2026-08-25) is intentionally
# NOT listed here — it's managed as a litellm db_model (added/updated via the
# /model/update API, id 21fe7883-2de6-4753-a59e-6f2fd2fd5ba9), not this config
# file. Adding it here too would create a duplicate model_list entry under the
# same model_name after render+restart. Params live in litellm's Postgres.
