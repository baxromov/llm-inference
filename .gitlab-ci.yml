default:
  tags:
    - applied-ai-innovation
  # Shell executor, same as every other repo in this group — no image:, no
  # apk add. See proxy-light's .gitlab-ci.yml for the fuller history of why.

stages:
  - deploy

# ─────────────────────────────────────────────────────────────────────────────
# Dev (172.31.174.11). Automatic on push to dev. Deploys to the repo's
# existing live path (~/llm-inference) rather than /opt/apps -- this
# directory predates that convention and already has a real .env deploy.sh
# won't touch. Runs the repo's own deploy.sh (--no-gpu: this host has no GPU
# -- Ollama runs separately on gpusrv02) rather than a bare docker compose,
# since deploy.sh already handles render/. env/pull/up/health-check
# idempotently and is the same tool used for manual deploys here.
# ─────────────────────────────────────────────────────────────────────────────
deploy-dev:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  variables:
    # Hardcoded, not "~/llm-inference": the CI job SSHs in as $DEPLOY_USER
    # (akbarovmabd, per the group variable), whose OWN home has no such
    # directory -- the real, existing deployment lives under bakhromovshb's
    # home specifically. Same class of mistake as proxy-light's ${HOME} bug
    # earlier the same day (see DevOps/CLAUDE.md's proxy-light section) --
    # this one broke job 822 the same way before being caught and fixed.
    DEPLOY_PATH: "/home/bakhromovshb/llm-inference"
  before_script:
    - |
      command -v ssh >/dev/null 2>&1 || \
        { command -v dnf >/dev/null 2>&1 && dnf install -y openssh-clients; } || \
        { command -v yum >/dev/null 2>&1 && yum install -y openssh-clients; } || \
        { command -v apt-get >/dev/null 2>&1 && apt-get update -qq && apt-get install -y -qq openssh-client; }
    - install -d -m 700 ~/.ssh
    - |
      printf '%s' "${DEV_DEPLOY_SSH_PRIVATE_KEY:?DEV_DEPLOY_SSH_PRIVATE_KEY is not set}" \
        | tr -d '\r\n[:space:]' \
        | base64 -d \
        > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
    - ssh-keyscan -H "$DEPLOY_IP_DEV" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_IP_DEV" 'echo SSH_OK'
    - scp docker-compose.yml deploy.sh manage.sh models.yaml .env.example "$DEPLOY_USER@$DEPLOY_IP_DEV:$DEPLOY_PATH/"
    - ssh "$DEPLOY_USER@$DEPLOY_IP_DEV" "rm -rf $DEPLOY_PATH/litellm && mkdir -p $DEPLOY_PATH/litellm"
    - scp -r litellm/. "$DEPLOY_USER@$DEPLOY_IP_DEV:$DEPLOY_PATH/litellm/"
    - ssh "$DEPLOY_USER@$DEPLOY_IP_DEV" "rm -rf $DEPLOY_PATH/scripts && mkdir -p $DEPLOY_PATH/scripts"
    - scp -r scripts/. "$DEPLOY_USER@$DEPLOY_IP_DEV:$DEPLOY_PATH/scripts/"
    # --no-fix: this host is already fully set up (Docker installed, .env in
    # place) -- skip deploy.sh's host-level auto-fix steps (e.g. relocating
    # Docker's data-root), which need interactive sudo that a non-interactive
    # CI SSH session doesn't have (job 822's failure: "sudo: a terminal is
    # required to read the password"). A routine config redeploy should only
    # touch the app layer (render/pull/up/health-check), not host infra.
    # No explicit chmod +x here -- deploy.sh/manage.sh are already committed
    # executable and scp preserves the mode bit from the source file. An
    # explicit chmod failed outright (job 825): these files are owned by
    # bakhromovshb, and akbarovmabd's group-write access lets it overwrite
    # their CONTENT via scp but not change their PERMISSION BITS -- that
    # needs file ownership, which group membership doesn't grant.
    - ssh "$DEPLOY_USER@$DEPLOY_IP_DEV" "cd $DEPLOY_PATH && ./deploy.sh --no-gpu --no-fix"
  environment:
    name: dev
    url: https://llm-gw.ai-dev.ipotekabank.uz

# ─────────────────────────────────────────────────────────────────────────────
# Preprod (172.31.214.10). Manual on staging -- see DevOps/CLAUDE.md's
# Preprod/staging rollout section for why preprod is runner-only. Lean
# scp+compose deploy (not deploy.sh -- that script's host-level steps, like
# relocating Docker's data-root, aren't appropriate for a shared host that's
# already set up; see shared-services' own deploy-preprod for the same
# reasoning). .env generated fresh on first deploy, idempotent thereafter.
# ─────────────────────────────────────────────────────────────────────────────
.preprod-ssh-setup:
  before_script:
    - |
      command -v ssh >/dev/null 2>&1 || \
        { command -v dnf >/dev/null 2>&1 && dnf install -y openssh-clients; } || \
        { command -v yum >/dev/null 2>&1 && yum install -y openssh-clients; } || \
        { command -v apt-get >/dev/null 2>&1 && apt-get update -qq && apt-get install -y -qq openssh-client; }
    - install -d -m 700 ~/.ssh
    - |
      printf '%s' "${PREPROD_DEPLOY_SSH_PRIVATE_KEY:?PREPROD_DEPLOY_SSH_PRIVATE_KEY is not set}" \
        | tr -d '\r\n[:space:]' \
        | base64 -d \
        > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
    - ssh-keyscan -H "$PREPROD_IP_ADDRESS" >> ~/.ssh/known_hosts

show-env-preprod:
  extends: .preprod-ssh-setup
  stage: deploy
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: manual
  allow_failure: true
  script:
    - ssh "$PREPROD_USER@$PREPROD_IP_ADDRESS" "cat ~/llm-inference-stage/.env"

deploy-preprod:
  extends: .preprod-ssh-setup
  stage: deploy
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: manual
  allow_failure: false
  variables:
    DEPLOY_PATH: "~/llm-inference-stage"
  script:
    - ssh "$PREPROD_USER@$PREPROD_IP_ADDRESS" 'echo SSH_OK'
    - ssh "$PREPROD_USER@$PREPROD_IP_ADDRESS" "install -d $DEPLOY_PATH"
    - scp docker-compose.stage.yml models.yaml "$PREPROD_USER@$PREPROD_IP_ADDRESS:$DEPLOY_PATH/"
    - ssh "$PREPROD_USER@$PREPROD_IP_ADDRESS" "rm -rf $DEPLOY_PATH/litellm && mkdir -p $DEPLOY_PATH/litellm"
    - scp -r litellm/. "$PREPROD_USER@$PREPROD_IP_ADDRESS:$DEPLOY_PATH/litellm/"
    - |
      ssh "$PREPROD_USER@$PREPROD_IP_ADDRESS" bash -s <<EOF
      set -e
      cd $DEPLOY_PATH
      if [ ! -f .env ]; then
        echo "No .env on host -- generating (first deploy)."
        cat > .env <<ENVEOF
      POSTGRES_PASSWORD=\$(openssl rand -hex 16)
      LITELLM_MASTER_KEY=sk-\$(openssl rand -hex 24)
      LITELLM_UI_USERNAME=admin
      LITELLM_UI_PASSWORD=\$(openssl rand -hex 12)
      ENVEOF
      fi
      sudo docker compose -p llm-gateway-stage -f docker-compose.stage.yml pull
      sudo docker compose -p llm-gateway-stage -f docker-compose.stage.yml up -d
      sudo docker compose -p llm-gateway-stage -f docker-compose.stage.yml ps
      EOF
  environment:
    name: preprod
    url: https://llm-gw.ai-stage.ipotekabank.uz
